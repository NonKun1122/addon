<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MC Addon Builder</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --ab:#2c2c2c; --abw:48px;
  --panel:#252526; --panelw:240px;
  --ed:#1e1e1e; --top:#2d2e30;
  --border:#3c3c3c; --bord2:#4a4a4a;
  --acc:#4ade80; --acc2:#22d3ee;
  --text:#d4d4d4; --text2:#9d9d9d; --text3:#585858;
  --hov:rgba(255,255,255,.06); --sel:rgba(74,222,128,.13);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--ed);color:var(--text);
  font-family:'Segoe UI',system-ui,sans-serif;font-size:13px;
  display:flex;flex-direction:column}

/* TOPBAR */
#topbar{height:40px;background:var(--top);border-bottom:1px solid #1c1c1c;
  display:flex;align-items:center;padding:0 8px;gap:8px;flex-shrink:0;z-index:200}
.logo{font-family:'Courier New',monospace;font-size:10px;font-weight:700;
  color:var(--acc);letter-spacing:.08em;padding:0 4px;
  text-shadow:0 0 10px rgba(74,222,128,.3)}
.proj-badge{background:rgba(255,255,255,.07);border:1px solid var(--bord2);
  border-radius:4px;padding:3px 10px;font-size:12px;color:var(--text2)}
.proj-badge b{color:var(--text)}
.tb-sp{flex:1}
.tb-btn{background:rgba(255,255,255,.07);border:1px solid var(--bord2);border-radius:4px;
  padding:4px 11px;color:var(--text2);cursor:pointer;font-size:12px;
  transition:.15s;font-family:inherit}
.tb-btn:hover{background:rgba(255,255,255,.12);color:var(--text)}
.tb-pri{background:var(--acc);border:none;border-radius:4px;padding:4px 14px;
  color:#000;font-weight:700;cursor:pointer;font-size:12px;
  transition:.15s;font-family:inherit}
.tb-pri:hover{background:#6ee79b}
.tb-pri:disabled{background:var(--border);color:var(--text3);cursor:not-allowed}

/* APP BODY */
#appbody{display:flex;flex:1;overflow:hidden;position:relative}

/* ACTIVITY BAR */
#actbar{width:var(--abw);min-width:var(--abw);background:var(--ab);
  border-right:1px solid #1c1c1c;display:flex;flex-direction:column;
  flex-shrink:0;z-index:100}
.ab-top{flex:1;display:flex;flex-direction:column;padding-top:4px}
.ab-bot{flex-shrink:0;padding-bottom:4px}
.ab-icon{width:var(--abw);height:var(--abw);display:flex;align-items:center;
  justify-content:center;cursor:pointer;font-size:19px;position:relative;
  border-left:2px solid transparent;color:rgba(255,255,255,.38);transition:.15s}
.ab-icon:hover{color:rgba(255,255,255,.75);background:var(--hov)}
.ab-icon.act{color:var(--text);border-color:var(--acc);background:rgba(74,222,128,.07)}
.ab-tip{position:absolute;left:calc(var(--abw) + 8px);top:50%;transform:translateY(-50%);
  background:#3a3a3a;border:1px solid var(--bord2);border-radius:4px;padding:4px 10px;
  font-size:11px;white-space:nowrap;pointer-events:none;opacity:0;
  transition:opacity .15s;z-index:999;color:var(--text)}
.ab-icon:hover .ab-tip{opacity:1}
.ab-dot{position:absolute;top:8px;right:8px;width:7px;height:7px;border-radius:50%}
.dot-ok{background:var(--acc)}.dot-warn{background:#f59e0b}.dot-err{background:#f87171}

/* PANEL — desktop default: visible */
#panel{width:var(--panelw);min-width:var(--panelw);background:var(--panel);
  border-right:1px solid #1c1c1c;display:flex;flex-direction:column;
  overflow:hidden;flex-shrink:0;transition:width .22s,min-width .22s,opacity .2s}
#panel.closed{width:0!important;min-width:0!important;opacity:0;pointer-events:none}
#phdr{height:35px;display:flex;align-items:center;padding:0 12px;
  border-bottom:1px solid var(--border);flex-shrink:0;gap:8px}
#ptitle{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--text3);flex:1;font-family:'Courier New',monospace;white-space:nowrap;overflow:hidden}
#pclose{background:none;border:none;color:var(--text3);cursor:pointer;font-size:14px;
  line-height:1;padding:3px 5px;transition:.1s;border-radius:3px}
#pclose:hover{color:var(--text);background:var(--hov)}
#pbody{flex:1;overflow-y:auto;overflow-x:hidden}
#pbody::-webkit-scrollbar{width:3px}
#pbody::-webkit-scrollbar-thumb{background:var(--bord2);border-radius:2px}

/* PANEL ITEMS */
.ps{padding:5px 0}
.ps-title{padding:8px 12px 3px;font-size:10px;color:var(--text3);
  letter-spacing:.1em;text-transform:uppercase;font-family:'Courier New',monospace}
.pi{display:flex;align-items:center;gap:6px;padding:5px 12px;cursor:pointer;
  color:var(--text2);font-size:12px;transition:.1s;border-left:2px solid transparent;
  min-height:27px;overflow:hidden}
.pi:hover{background:var(--hov);color:var(--text)}
.pi.sel{background:var(--sel);color:var(--acc);border-color:var(--acc)}
.pi-ico{font-size:12px;flex-shrink:0;width:15px;text-align:center}
.pi-lbl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pi-tag{font-size:9px;padding:1px 5px;border-radius:3px;flex-shrink:0;
  background:rgba(255,255,255,.1);color:var(--text3)}
.pi-tag.ok{background:rgba(74,222,128,.2);color:var(--acc)}
.pi-tag.warn{background:rgba(245,158,11,.18);color:#f59e0b}
.pi-del{background:none;border:none;color:var(--text3);cursor:pointer;
  font-size:13px;padding:0 2px;line-height:1;transition:.1s;flex-shrink:0}
.pi-del:hover{color:#f87171}
.p-add{display:flex;align-items:center;justify-content:center;gap:6px;
  padding:8px 12px;cursor:pointer;color:var(--text3);font-size:12px;
  transition:.1s;border:none;background:none;font-family:inherit;width:100%}
.p-add:hover{color:var(--acc);background:var(--hov)}
.pdiv{height:1px;background:var(--border);margin:3px 0}

/* RESIZE */
#rh{width:4px;flex-shrink:0;cursor:ew-resize;background:transparent;
  border-right:1px solid var(--border);transition:background .1s}
#rh:hover,#rh.drag{background:var(--acc);border-color:var(--acc)}
#panel.closed + #rh{display:none}

/* EDITOR */
#editor{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
#etabs{height:35px;background:#252526;border-bottom:1px solid var(--border);
  display:flex;align-items:stretch;flex-shrink:0;overflow-x:auto;overflow-y:hidden}
#etabs::-webkit-scrollbar{height:0}
.etab{height:100%;padding:0 18px;display:flex;align-items:center;gap:6px;
  font-size:12px;color:var(--text3);cursor:pointer;white-space:nowrap;
  border-right:1px solid var(--border);border-bottom:2px solid transparent;
  transition:.1s;flex-shrink:0}
.etab:hover{color:var(--text);background:rgba(255,255,255,.04)}
.etab.sel{color:var(--text);background:var(--ed);border-bottom-color:var(--acc)}
#econtent{flex:1;overflow-y:auto;padding:22px 26px}
#econtent::-webkit-scrollbar{width:6px}
#econtent::-webkit-scrollbar-thumb{background:var(--bord2);border-radius:3px}

/* STATUS BAR */
#sb{height:22px;background:#3d8b5e;display:flex;align-items:center;
  justify-content:space-between;padding:0 10px;font-size:11px;
  color:rgba(0,0,0,.75);font-weight:600;flex-shrink:0;z-index:100}

/* OVERLAY */
#ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);
  z-index:150;backdrop-filter:blur(2px)}
#ov.show{display:block}

/* CONTENT ELEMENTS */
.sec-h{font-size:17px;font-weight:700;color:#fff;margin-bottom:3px}
.sec-s{color:var(--text2);font-size:12px;margin-bottom:16px;line-height:1.5}
.card{background:#2a2a2a;border:1px solid var(--border);border-radius:7px;
  padding:14px;margin-bottom:12px}
.card-h{font-size:11px;font-weight:700;color:var(--text);margin-bottom:11px;
  display:flex;align-items:center;gap:8px}
.fg{display:grid;gap:11px;margin-bottom:12px}
.fg2{grid-template-columns:1fr 1fr}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:10px;color:var(--text3);font-weight:600;
  letter-spacing:.07em;text-transform:uppercase}
.fld input,.fld select,.fld textarea{
  background:#373737;border:1px solid var(--bord2);border-radius:4px;
  padding:7px 9px;color:var(--text);font-size:12px;font-family:inherit;transition:.15s}
.fld input:focus,.fld select:focus,.fld textarea:focus{
  outline:none;border-color:var(--acc);background:#3d3d3d}
.fld select option{background:#373737}
.fld textarea{resize:vertical;min-height:60px;
  font-family:'Consolas','Courier New',monospace;font-size:11px}
.hint{font-size:10px;color:var(--text3);margin-top:2px}
.btn{padding:5px 12px;border-radius:4px;border:none;cursor:pointer;
  font-size:12px;font-weight:600;transition:.15s;font-family:inherit}
.btn-g{background:var(--acc);color:#000}.btn-g:hover{background:#6ee79b}
.btn-s{background:rgba(255,255,255,.07);border:1px solid var(--bord2);color:var(--text2)}
.btn-s:hover{color:var(--text);background:rgba(255,255,255,.11)}
.btn-r{background:rgba(239,68,68,.14);border:1px solid rgba(239,68,68,.28);color:#f87171}
.btn-r:hover{background:rgba(239,68,68,.22)}
.sep{height:1px;background:var(--border);margin:12px 0}
.row{display:flex;align-items:center;gap:8px}
.mt8{margin-top:8px}.mt12{margin-top:12px}
.empty{display:flex;flex-direction:column;align-items:center;
  justify-content:center;min-height:200px;color:var(--text3);gap:10px}
.empty-ico{font-size:40px}

/* UUID */
.uuid-list{display:flex;flex-direction:column;gap:5px}
.ur{display:flex;align-items:center;gap:7px;background:#303030;
  border:1px solid var(--border);border-radius:5px;padding:6px 10px}
.ul{font-size:10px;color:var(--text3);width:105px;flex-shrink:0;
  font-family:'Courier New',monospace}
.uv{flex:1;font-family:'Courier New',monospace;font-size:10px;
  color:var(--acc2);word-break:break-all;line-height:1.4}
.ue{color:var(--text3);font-style:italic;font-size:10px}
.bxs{padding:3px 7px;font-size:10px;border-radius:3px;border:1px solid var(--bord2);
  background:transparent;color:var(--text3);cursor:pointer;transition:.15s;
  font-family:inherit;white-space:nowrap}
.bxs:hover{border-color:var(--acc);color:var(--acc)}
.bxs.ok{border-color:var(--acc2);color:var(--acc2)}

/* CODE BOX */
.cbox{background:#191919;border:1px solid var(--border);border-radius:6px;
  overflow:hidden;margin-top:10px}
.cx-h{display:flex;align-items:center;justify-content:space-between;
  padding:5px 11px;background:#222;border-bottom:1px solid var(--border)}
.cx-lang{font-size:10px;color:var(--acc2);font-family:'Courier New',monospace;letter-spacing:.1em}
.cx-body{padding:11px;overflow:auto;max-height:300px}
.cx-body pre{font-family:'Consolas','Courier New',monospace;font-size:11px;
  line-height:1.7;color:#d4d4d4;white-space:pre}
.cx-body textarea{width:100%;min-height:300px;background:transparent;border:none;
  outline:none;font-family:'Consolas','Courier New',monospace;font-size:11px;
  line-height:1.7;color:#d4d4d4;resize:vertical}

/* MINI TABS */
.mt{display:flex;border-bottom:1px solid var(--border)}
.mt-t{padding:5px 12px;font-size:11px;color:var(--text3);cursor:pointer;
  border-bottom:2px solid transparent;transition:.1s}
.mt-t:hover{color:var(--text)}.mt-t.sel{color:var(--acc);border-color:var(--acc)}

/* TEXTURE */
.tex2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.uz{border:1.5px dashed var(--bord2);border-radius:6px;padding:16px 10px;
  text-align:center;cursor:pointer;transition:.15s;position:relative;overflow:hidden}
.uz:hover{border-color:var(--acc);background:rgba(74,222,128,.03)}
.uz.filled{border-style:solid;border-color:var(--acc)}
.uz input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.uz img{max-width:70px;max-height:56px;image-rendering:pixelated;
  display:block;margin:0 auto 6px}
.uz-l{font-size:11px;color:var(--text3)}
.uz.filled .uz-l{color:var(--acc);font-size:10px}
.uz-h{font-size:9px;color:var(--text3);margin-top:3px}

/* FILE TREE */
.ti{display:flex;align-items:center;gap:5px;padding:4px 10px;cursor:pointer;
  font-size:11px;color:var(--text2);transition:.08s;border-left:2px solid transparent;
  font-family:'Consolas','Courier New',monospace;white-space:nowrap;overflow:hidden}
.ti:hover{background:var(--hov);color:var(--text)}
.ti.sel{color:var(--acc);border-color:var(--acc);background:var(--sel)}
.ti.dir{color:#d7ba7d;cursor:default;font-weight:700}
.ti.dir:hover{background:transparent}
.ti.d1{padding-left:20px}.ti.d2{padding-left:30px}

/* EXPORT */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stat{background:#2a2a2a;border:1px solid var(--border);border-radius:7px;
  padding:12px;text-align:center}
.stat-n{font-size:22px;font-weight:700;color:var(--acc);font-family:'Courier New',monospace}
.stat-l{font-size:10px;color:var(--text2);margin-top:2px}
.dl-btn{width:100%;padding:11px;background:var(--acc);color:#000;font-weight:700;
  font-size:14px;border:none;border-radius:7px;cursor:pointer;transition:.15s;font-family:inherit}
.dl-btn:hover{background:#6ee79b;transform:translateY(-1px)}
.dl-btn:disabled{background:var(--border);color:var(--text3);cursor:not-allowed;transform:none}
.wbox{background:rgba(245,158,11,.07);border:1px solid rgba(245,158,11,.2);
  border-radius:6px;padding:11px 14px;margin-bottom:12px}
.wbox h4{color:#f59e0b;margin-bottom:6px;font-size:11px}
.wbox ul{padding-left:14px;font-size:11px;color:var(--text2);line-height:1.9}
.okbox{background:rgba(74,222,128,.07);border:1px solid rgba(74,222,128,.18);
  border-radius:6px;padding:11px 14px;margin-bottom:10px}
.okbox h4{color:var(--acc);margin-bottom:5px;font-size:11px}
.okbox ul{padding-left:14px;font-size:11px;color:var(--text2);line-height:1.9}
.ebox{background:rgba(239,68,68,.07);border:1px solid rgba(239,68,68,.2);
  border-radius:6px;padding:10px 14px;margin-bottom:10px;font-size:12px;color:#f87171}
.al{border-radius:6px;padding:10px 13px;font-size:12px;margin-bottom:10px}
.al-i{background:rgba(14,165,233,.09);border:1px solid rgba(14,165,233,.2);color:#38bdf8}

/* MOBILE */
@media(max-width:768px){
  #appbody{flex-direction:column}
  #actbar{
    width:100%;height:52px;min-width:unset;
    flex-direction:row;order:3;
    border-right:none;border-top:1px solid #1c1c1c;flex-shrink:0}
  .ab-top{flex-direction:row;justify-content:space-around;flex:1;padding-top:0}
  .ab-bot{flex-shrink:0;padding-bottom:0}
  .ab-icon{width:52px;height:52px;border-left:none;
    border-top:2px solid transparent;border-bottom:none}
  .ab-icon.act{border-top-color:var(--acc);border-left:none}
  .ab-tip{display:none!important}
  #panel{
    position:fixed;bottom:52px;left:0;right:0;
    width:100%!important;min-width:unset!important;
    height:65vh;border-right:none;
    border-top:1px solid var(--border);border-radius:14px 14px 0 0;
    transform:translateY(110%);transition:transform .25s ease;
    opacity:1!important;pointer-events:none;z-index:160}
  #panel.mob-open{transform:translateY(0);pointer-events:auto}
  /* on mobile, closed = slidedown, not width 0 */
  #panel.closed{width:100%!important;min-width:unset!important;transform:translateY(110%)}
  #editor{order:1}
  #rh{display:none}
  .fg2,.tex2,.stats{grid-template-columns:1fr 1fr}
  #econtent{padding:14px}
}
@media(max-width:480px){
  .fg2,.tex2{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr}
}

#projectHub{position:fixed;inset:0;background:#1e1e1e;z-index:10000;display:flex;align-items:center;justify-content:center}
#projectHub .hub{background:#252526;padding:20px;border-radius:12px;width:min(95vw,700px);color:white}
#projectList{max-height:300px;overflow:auto;margin-top:10px}
.projectCard{padding:10px;border:1px solid #444;border-radius:8px;margin:8px 0;cursor:pointer}
.projectCard:hover{background:#333}

/* TEMPLATE MODAL */
#tplModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:5000;
  align-items:center;justify-content:center;backdrop-filter:blur(3px)}
#tplModal.show{display:flex}
.tpl-box{background:#252526;border:1px solid var(--bord2);border-radius:10px;  width:min(94vw,680px);max-height:85vh;display:flex;flex-direction:column;overflow:hidden}
.tpl-hdr{display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;border-bottom:1px solid var(--border);flex-shrink:0}
.tpl-hdr h3{font-size:14px;color:#fff}
.tpl-close{background:none;border:none;color:var(--text3);cursor:pointer;font-size:18px;
  line-height:1;padding:2px 6px;border-radius:4px;transition:.1s}
.tpl-close:hover{color:#fff;background:var(--hov)}
.tpl-tabs{display:flex;border-bottom:1px solid var(--border);padding:0 14px;flex-shrink:0}
.tpl-tab{padding:8px 14px;font-size:12px;color:var(--text3);cursor:pointer;
  border-bottom:2px solid transparent;transition:.1s}
.tpl-tab:hover{color:var(--text)}.tpl-tab.sel{color:var(--acc);border-color:var(--acc)}
.tpl-body{flex:1;overflow-y:auto;padding:16px}
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.tpl-card{background:#1e1e1e;border:1px solid var(--border);border-radius:8px;
  padding:14px;cursor:pointer;transition:.15s;text-align:center}
.tpl-card:hover{border-color:var(--acc);background:#222;transform:translateY(-2px)}
.tpl-card-ico{font-size:36px;margin-bottom:8px}
.tpl-card-name{font-size:12px;font-weight:700;color:var(--text);margin-bottom:4px}
.tpl-card-desc{font-size:10px;color:var(--text3);line-height:1.4}
.tpl-card-slot{font-size:9px;color:var(--acc2);margin-top:5px;
  font-family:'Courier New',monospace}

/* ICON UPLOAD */
.icon-uz{border:1.5px dashed var(--bord2);border-radius:8px;padding:18px;
  text-align:center;cursor:pointer;transition:.15s;position:relative;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;gap:6px}
.icon-uz:hover{border-color:var(--acc);background:rgba(74,222,128,.03)}
.icon-uz.filled{border-style:solid;border-color:var(--acc)}
.icon-uz input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.icon-uz img{width:64px;height:64px;image-rendering:pixelated;border-radius:4px}

/* ASSETS TAB */
.asset-row{display:flex;align-items:center;gap:10px;background:#252526;
  border:1px solid var(--border);border-radius:7px;padding:10px 12px;margin-bottom:8px}
.asset-ico{font-size:20px;flex-shrink:0}
.asset-info{flex:1;min-width:0}
.asset-name{font-size:12px;color:var(--text);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.asset-meta{font-size:10px;color:var(--text3);margin-top:2px}
.asset-actions{display:flex;gap:6px;flex-shrink:0}

/* EDITABLE CODE */
.code-edited{border-color:var(--acc2)!important}
.edit-badge{font-size:9px;padding:2px 6px;border-radius:3px;
  background:rgba(34,211,238,.15);color:var(--acc2);margin-left:6px}

/* FULL CODE EDITOR */
#econtent.editor-mode{padding:0!important;overflow:hidden!important;display:flex!important;flex-direction:column!important}
.ed-toolbar{height:36px;background:#252526;border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 12px;gap:8px;flex-shrink:0;min-width:0}
.ed-path{font-family:'Courier New',monospace;font-size:10px;color:var(--text2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.ed-lang{font-size:9px;font-weight:700;letter-spacing:.08em;padding:2px 7px;
  border-radius:3px;flex-shrink:0}
.ed-lang.js{background:rgba(245,158,11,.15);color:#f59e0b}
.ed-lang.json{background:rgba(34,211,238,.12);color:var(--acc2)}
.ed-lang.txt{background:rgba(255,255,255,.06);color:var(--text3)}
.ed-lang.img{background:rgba(74,222,128,.1);color:var(--acc)}
.ed-body{flex:1;overflow:hidden;display:flex;min-height:0}
.code-editor-ta{width:100%;height:100%;background:#1b1b1b;border:none;outline:none;
  font-family:'Consolas','Courier New',monospace;font-size:12.5px;line-height:1.8;
  color:#d4d4d4;padding:16px 20px;resize:none;tab-size:2;-moz-tab-size:2;
  caret-color:var(--acc)}
.code-editor-ta::selection{background:rgba(74,222,128,.22)}
.ed-img-view{flex:1;display:flex;align-items:center;justify-content:center;
  background:#1b1b1b;flex-direction:column;gap:10px}
.ed-welcome{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:6px;background:#1b1b1b;color:var(--text3)}
.file-dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}
.file-dot.custom{background:var(--acc2)}.file-dot.ok{background:var(--acc)}
</style>
</head>
<body>
<div id="topbar">
  <div class="logo">⬛ MC ADDON</div>
  <div class="proj-badge">📁 <b id="hdr-ns">myaddon</b></div>
  <div class="tb-sp"></div>
  <button class="tb-btn" onclick="showHub()" title="เปลี่ยนโปรเจกต์">📁 Projects</button>
  <button class="tb-btn" onclick="resetAll()">↺ Reset</button>
  <button class="tb-pri" id="hdr-dl" onclick="downloadAddon()">↓ Download</button>
</div>

<div id="appbody">
  <div id="actbar">
    <div class="ab-top" id="ab-icons"></div>
    <div class="ab-bot">
      <div class="ab-icon" onclick="downloadAddon()">
        📥<div class="ab-tip">Download .mcaddon</div>
      </div>
    </div>
  </div>

  <div id="ov" onclick="closeMob()"></div>

  <div id="panel">
    <div id="phdr">
      <span id="ptitle">SETUP</span>
      <button id="pclose" onclick="togglePanel()">✕</button>
    </div>
    <div id="pbody"></div>
  </div>

  <div id="rh"></div>

  <div id="editor">
    <div id="etabs"></div>
    <div id="econtent"></div>
  </div>
</div>

<div id="sb">
  <span id="sb-l">⬛ MC Addon Builder</span>
  <span id="sb-r"></span>
</div>

<script>
/* ────────── HELPERS ────────── */
const $  = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const h  = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const j  = v => JSON.stringify(v, null, 2);
const uid = () => crypto.randomUUID();
const isMob = () => window.innerWidth <= 768;

/* ────────── STATE ────────── */
let S = makeState();
function makeState() {
  return {
    proj: { bpName:'MyAddon BP', rpName:'MyAddon RP', ns:'myaddon', desc:'Custom Addon',
            uuids:{bpH:'',bpD:'',bpS:'',rpH:'',rpM:''},
            bpIcon: null, rpIcon: null },
    items: [], tex: {},
    models: {},      // { itemId: geoJsonText }
    anims: {},       // { itemId: animJsonText }
    customFiles: {}, // { 'path/file.json': overrideText }
    opts: { autoGive:true, playerFilter:'' },
    scriptCustom: null,
    act: 'setup', panelOpen: true,
    selItem: null, selTexItem: null, selAssetItem: null, pvFile: null,
  };
}

/* ────────── ACTIVITIES ────────── */
const ACTS = [
  {id:'setup',    em:'⚙️', tip:'ตั้งค่าโปรเจกต์'},
  {id:'items',    em:'📦', tip:'จัดการไอเทม'},
  {id:'textures', em:'🎨', tip:'อัปโหลดเทกเจอร์'},
  {id:'assets',   em:'🗂️', tip:'โมเดล & อนิเมชั่น'},
  {id:'editor',   em:'💻', tip:'Code Editor'},
  {id:'export',   em:'📥', tip:'Download .mcaddon'},
];
const PANEL_TITLES = {
  setup:'SETUP', items:'ITEMS', textures:'TEXTURES',
  assets:'ASSETS', editor:'EXPLORER', export:'EXPORT'
};

/* ────────── NAVIGATION ────────── */
function setAct(id) {
  if (S.act === id) { togglePanel(); return; }
  S.act = id;
  S.panelOpen = true;
  applyPanel();
  renderAll();
}

function togglePanel() {
  S.panelOpen = !S.panelOpen;
  applyPanel();
  renderActivityBar();
}

function applyPanel() {
  const p = $('#panel'), ov = $('#ov');
  if (isMob()) {
    p.classList.toggle('mob-open', S.panelOpen);
    ov.classList.toggle('show', S.panelOpen);
  } else {
    p.classList.toggle('closed', !S.panelOpen);
    ov.classList.remove('show');
  }
}

function closeMob() {
  S.panelOpen = false;
  $('#panel').classList.remove('mob-open');
  $('#ov').classList.remove('show');
}

window.addEventListener('resize', () => {
  if (!isMob()) {
    $('#ov').classList.remove('show');
    $('#panel').classList.remove('mob-open');
    applyPanel();
  }
});

/* ────────── RENDER ALL ────────── */
function renderAll() {
  renderActivityBar();
  renderPanel();
  renderTabs();
  renderEditor();
  renderStatus();
}

/* ────────── ACTIVITY BAR ────────── */
function renderActivityBar() {
  const u = S.proj.uuids;
  const uOk = Object.values(u).every(v=>v);
  const hasModels = S.items.some(i => S.models[i.id]);
  const hasCustom = Object.keys(S.customFiles||{}).length > 0;
  const dots = {
    setup:    uOk ? 'ok' : 'warn',
    items:    S.items.length ? 'ok' : '',
    textures: '',
    assets:   hasModels ? 'ok' : '',
    editor:   hasCustom ? 'ok' : '',
    export:   uOk && S.items.length ? 'ok' : 'warn',
  };
  $('#ab-icons').innerHTML = ACTS.map(a => {
    const dot = dots[a.id];
    return [
      '<div class="ab-icon' + (S.act===a.id?' act':'') + '" onclick="setAct(\'' + a.id + '\')">',
        a.em,
        '<div class="ab-tip">' + a.tip + '</div>',
        dot ? '<div class="ab-dot dot-' + dot + '"></div>' : '',
      '</div>'
    ].join('');
  }).join('');
}

/* ────────── PANEL ────────── */
function renderPanel() {
  $('#ptitle').textContent = PANEL_TITLES[S.act] || S.act.toUpperCase();
  const b = $('#pbody');

  if (S.act === 'setup') {
    const u = S.proj.uuids;
    const uOk = Object.values(u).every(v=>v);
    const uKeys = {bpH:'BP Header',bpD:'BP Data',bpS:'BP Script',rpH:'RP Header',rpM:'RP Module'};
    let html = '<div class="ps">';
    html += '<div class="ps-title">PROJECT</div>';
    html += '<div class="pi"><span class="pi-ico">📋</span><span class="pi-lbl">' + h(S.proj.bpName) + '</span></div>';
    html += '<div class="pi"><span class="pi-ico">🔤</span><span class="pi-lbl">' + h(S.proj.ns) + '</span>';
    html += '<span class="pi-tag ' + (uOk?'ok':'warn') + '">' + (uOk?'UUID ✓':'UUID !') + '</span></div>';
    html += '</div><div class="pdiv"></div><div class="ps">';
    html += '<div class="ps-title">UUID STATUS</div>';
    Object.keys(uKeys).forEach(k => {
      html += '<div class="pi"><span class="pi-ico">' + (u[k]?'🟢':'🔴') + '</span>';
      html += '<span class="pi-lbl" style="font-family:\'Courier New\',monospace;font-size:10px">' + uKeys[k] + '</span></div>';
    });
    html += '</div><div class="pdiv"></div>';
    html += '<div style="padding:8px 12px"><button class="btn btn-g" style="width:100%;font-size:11px" onclick="genAllUUIDs()">✨ Generate All UUIDs</button></div>';
    b.innerHTML = html;
    return;
  }

  if (S.act === 'items') {
    let html = '<div class="ps"><div class="ps-title">ITEMS (' + S.items.length + ')</div>';
    if (S.items.length === 0) {
      html += '<div class="pi" style="cursor:default;color:var(--text3)">ยังไม่มีไอเทม</div>';
    }
    S.items.forEach(it => {
      html += '<div class="pi' + (it.id===S.selItem?' sel':'') + '" onclick="pickItem(\'' + it.id + '\')">';
      html += '<span class="pi-ico">📦</span>';
      html += '<span class="pi-lbl">' + h(it.displayName) + '</span>';
      html += '<button class="pi-del" onclick="delItem(\'' + it.id + '\',event)" title="ลบ">✕</button>';
      html += '</div>';
    });
    html += '</div><div class="pdiv"></div>';
    html += '<button class="p-add" onclick="addItem()">＋ เพิ่มไอเทมใหม่</button>';
    b.innerHTML = html;
    return;
  }

  if (S.act === 'textures') {
    let html = '<div class="ps"><div class="ps-title">ITEMS</div>';
    if (S.items.length === 0) {
      html += '<div class="pi" style="cursor:default;color:var(--text3);font-size:12px;padding:12px">เพิ่มไอเทมก่อน</div>';
    }
    S.items.forEach(it => {
      const hasI = !!S.tex['icon_'+it.id];
      const hasM = !!S.tex['model_'+it.id];
      let tagCls='', tagTxt='0/2';
      if (hasI && hasM) { tagCls='ok'; tagTxt='2/2'; }
      else if (hasI || hasM) { tagCls='warn'; tagTxt='1/2'; }
      html += '<div class="pi' + (it.id===S.selTexItem?' sel':'') + '" onclick="pickTexItem(\'' + it.id + '\')">';
      html += '<span class="pi-ico">📦</span>';
      html += '<span class="pi-lbl">' + h(it.displayName) + '</span>';
      html += '<span class="pi-tag ' + tagCls + '">' + tagTxt + '</span></div>';
    });
    html += '</div>';
    b.innerHTML = html;
    return;
  }

  if (S.act === 'assets') {
    let html = '<div class="ps"><div class="ps-title">ITEMS</div>';
    if (S.items.length === 0) {
      html += '<div class="pi" style="cursor:default;color:var(--text3);font-size:12px;padding:12px">เพิ่มไอเทมก่อน</div>';
    }
    S.items.forEach(it => {
      const hasGeo  = !!S.models[it.id];
      const hasAnim = !!S.anims[it.id];
      let tagCls='', tagTxt='0/2';
      if (hasGeo && hasAnim) { tagCls='ok'; tagTxt='2/2'; }
      else if (hasGeo || hasAnim) { tagCls='warn'; tagTxt='1/2'; }
      html += '<div class="pi' + (it.id===S.selAssetItem?' sel':'') + '" onclick="pickAssetItem(\'' + it.id + '\')">';
      html += '<span class="pi-ico">🗂️</span>';
      html += '<span class="pi-lbl">' + h(it.displayName) + '</span>';
      html += '<span class="pi-tag ' + tagCls + '">' + tagTxt + '</span></div>';
    });
    html += '</div><div class="pdiv"></div>';
    html += '<div style="padding:8px 12px"><button class="btn btn-s" style="width:100%;font-size:11px" onclick="openTplModal()">🧩 Template Picker</button></div>';
    b.innerHTML = html;
    return;
  }

  if (S.act === 'editor') {
    renderEditorPanel(b);
    return;
  }

  if (S.act === 'export') {
    const u = S.proj.uuids;
    const uOk = Object.values(u).every(v=>v);
    const canDl = uOk && S.items.length > 0;
    const checks = [
      {ok:uOk,    lbl:'UUID ครบ 5 ตัว'},
      {ok:S.items.length>0, lbl:'มีไอเทม '+S.items.length+' ตัว'},
      {ok:Object.keys(S.tex).length>0, lbl:'มีเทกเจอร์ '+Object.keys(S.tex).length+' ไฟล์'},
      {ok:S.items.some(i=>S.models[i.id]), lbl:'โมเดล geo.json'},
      {ok:Object.keys(S.customFiles||{}).length>0, lbl:'มีการแก้โค้ด '+Object.keys(S.customFiles||{}).length+' ไฟล์'},
    ];
    let html = '<div class="ps"><div class="ps-title">CHECKLIST</div>';
    checks.forEach(c => {
      html += '<div class="pi" style="cursor:default"><span class="pi-ico">' + (c.ok?'✅':'⚠️') + '</span>';
      html += '<span class="pi-lbl">' + c.lbl + '</span></div>';
    });
    html += '</div><div class="pdiv"></div><div style="padding:8px 12px">';
    html += '<button class="dl-btn" onclick="downloadAddon()"' + (canDl?'':' disabled') + '>📥 Download</button></div>';
    b.innerHTML = html;
    return;
  }
}

/* ────────── TABS ────────── */
const TAB_INFO = {
  setup:    {ico:'⚙️', lbl:'manifest.json'},
  items:    {ico:'📦', lbl:'items/'},
  textures: {ico:'🎨', lbl:'textures/'},
  assets:   {ico:'🗂️', lbl:'assets/'},
  editor:   {ico:'💻', lbl:'Code Editor'},
  export:   {ico:'📥', lbl:'export'},
};
function renderTabs() {
  const t = TAB_INFO[S.act];
  if (!t) { $('#etabs').innerHTML=''; return; }
  const lbl = S.act==='editor' && S.pvFile ? S.pvFile.split('/').pop() : t.lbl;
  $('#etabs').innerHTML = '<div class="etab sel">' + t.ico + ' ' + h(lbl) + '</div>';
}

/* ────────── STATUS BAR ────────── */
function renderStatus() {
  const lbls = {setup:'⚙️ ตั้งค่า',items:'📦 ไอเทม',textures:'🎨 เทกเจอร์',
    assets:'🗂️ Assets',editor:'💻 Code Editor',export:'📥 Export'};
  const ns = S.proj.ns||'myaddon';
  const customCount = Object.keys(S.customFiles||{}).length;
  $('#sb-l').textContent = (lbls[S.act]||S.act) + ' — ' + ns + (customCount ? '  ✏️ '+customCount+' custom' : '');
  const uOk = Object.values(S.proj.uuids).every(v=>v);
  $('#sb-r').textContent = S.items.length + ' items  ' + (uOk?'UUID ✓':'UUID ⚠');
}

/* ────────── EDITOR ────────── */
function renderEditor() {
  const el = $('#econtent');
  // Toggle editor-mode class for full-height code editor
  if (S.act === 'editor') {
    el.classList.add('editor-mode');
  } else {
    el.classList.remove('editor-mode');
  }
  if (S.act === 'setup')    renderSetupEd(el);
  else if (S.act === 'items')    renderItemsEd(el);
  else if (S.act === 'textures') renderTexEd(el);
  else if (S.act === 'assets')   renderAssetsEd(el);
  else if (S.act === 'editor')   renderCodeEditor(el);
  else if (S.act === 'export')   renderExportEd(el);
}

function renderSetupEd(el) {
  const p = S.proj;
  const bpIconSrc = p.bpIcon, rpIconSrc = p.rpIcon;
  el.innerHTML = [
    '<div class="sec-h">⚙️ ตั้งค่าโปรเจกต์</div>',
    '<div class="sec-s">กำหนดชื่อ, namespace และ UUID ก่อนสร้างไอเทม</div>',
    '<div class="card">',
    '<div class="card-h">📋 ข้อมูลพื้นฐาน</div>',
    '<div class="fg fg2">',
    '<div class="fld"><label>Behavior Pack Name</label><input id="in-bp" value="' + h(p.bpName) + '" oninput="onSetupChange()"></div>',
    '<div class="fld"><label>Resource Pack Name</label><input id="in-rp" value="' + h(p.rpName) + '" oninput="onSetupChange()"></div>',
    '</div>',
    '<div class="fg fg2">',
    '<div class="fld"><label>Namespace ★</label><input id="in-ns" value="' + h(p.ns) + '" oninput="onSetupChange()"><div class="hint">ตัวพิมพ์เล็ก ไม่มีช่องว่าง เช่น myaddon</div></div>',
    '<div class="fld"><label>คำอธิบาย</label><input id="in-desc" value="' + h(p.desc) + '" oninput="onSetupChange()"></div>',
    '</div></div>',

    // Pack Icons
    '<div class="card">',
    '<div class="card-h">🖼️ Pack Icon (pack_icon.png)</div>',
    '<div class="al al-i" style="margin-bottom:12px">💡 ไอคอนแสดงในหน้า Resource Pack / Behavior Pack ของเกม — แนะนำ PNG <b>64×64</b> หรือ <b>128×128</b></div>',
    '<div class="tex2">',
    // BP Icon
    '<div>',
    '<div style="font-size:10px;color:var(--text3);margin-bottom:6px;font-weight:600;letter-spacing:.07em;text-transform:uppercase">Behavior Pack Icon</div>',
    '<div class="icon-uz' + (bpIconSrc?' filled':'') + '">',
    '<input type="file" accept="image/png,image/jpeg,image/gif" onchange="handlePackIcon(event,\'bp\')">',
    bpIconSrc ? '<img src="' + bpIconSrc + '" alt="BP Icon">' : '<div style="font-size:38px">📦</div>',
    '<div class="uz-l" style="font-size:11px">' + (bpIconSrc?'✅ อัปโหลดแล้ว':'คลิกเพื่ออัปโหลด') + '</div>',
    '<div class="uz-h">PNG 64×64 แนะนำ</div>',
    '</div>',
    bpIconSrc ? '<button class="btn btn-r mt8" style="width:100%;font-size:11px" onclick="S.proj.bpIcon=null;renderSetupEd($(\'#econtent\'))">✕ ลบ</button>' : '',
    '</div>',
    // RP Icon
    '<div>',
    '<div style="font-size:10px;color:var(--text3);margin-bottom:6px;font-weight:600;letter-spacing:.07em;text-transform:uppercase">Resource Pack Icon</div>',
    '<div class="icon-uz' + (rpIconSrc?' filled':'') + '">',
    '<input type="file" accept="image/png,image/jpeg,image/gif" onchange="handlePackIcon(event,\'rp\')">',
    rpIconSrc ? '<img src="' + rpIconSrc + '" alt="RP Icon">' : '<div style="font-size:38px">🎨</div>',
    '<div class="uz-l" style="font-size:11px">' + (rpIconSrc?'✅ อัปโหลดแล้ว':'คลิกเพื่ออัปโหลด') + '</div>',
    '<div class="uz-h">PNG 64×64 แนะนำ</div>',
    '</div>',
    rpIconSrc ? '<button class="btn btn-r mt8" style="width:100%;font-size:11px" onclick="S.proj.rpIcon=null;renderSetupEd($(\'#econtent\'))">✕ ลบ</button>' : '',
    '</div>',
    '</div></div>',

    // UUIDs
    '<div class="card">',
    '<div class="card-h" style="justify-content:space-between">',
    '<span>🔑 UUID</span>',
    '<button class="btn btn-g" style="font-size:11px;padding:4px 11px" onclick="genAllUUIDs()">✨ Generate ทั้งหมด</button>',
    '</div>',
    '<div class="uuid-list" id="uuid-list"></div>',
    '</div>'
  ].join('');
  renderUUIDs();
}

function renderItemsEd(el) {
  const item = S.items.find(i => i.id === S.selItem);
  if (!item) {
    el.innerHTML = [
      '<div class="sec-h">📦 ไอเทม</div>',
      '<div class="sec-s">เลือกไอเทมจากแถบซ้าย หรือเพิ่มใหม่</div>',
      '<div class="empty"><div class="empty-ico">📦</div>',
      '<div>เลือกไอเทมทางซ้าย</div>',
      '<button class="btn btn-g" onclick="addItem()">➕ เพิ่มไอเทมใหม่</button></div>'
    ].join('');
    return;
  }
  const ns  = S.proj.ns || 'myaddon';
  const slots = ['slot.armor.head','slot.armor.chest','slot.armor.legs','slot.armor.feet'];
  const slotOpts = slots.map(s => '<option'+(item.slot===s?' selected':'')+'>'+s+'</option>').join('');

  const bpPath  = 'BehaviorPack_'+ns+'/items/'+item.id+'.json';
  const trPath  = 'BehaviorPack_'+ns+'/items/'+item.id+'_trigger.json';
  const attPath = 'ResourcePack_'+ns+'/attachables/'+item.id+'.json';
  const scriptPath = 'BehaviorPack_'+ns+'/scripts/main.js';

  function fileBtn(path, label) {
    const isCustom = !!S.customFiles[path];
    return '<button class="btn btn-s" style="font-size:11px;display:flex;align-items:center;gap:5px" onclick="openInEditor(\''+path+'\')">' +
      (isCustom ? '<span style="color:var(--acc2)">✏️</span>' : '<span style="color:var(--text3)">⚡</span>') +
      label + '</button>';
  }

  el.innerHTML = [
    '<div class="sec-h">📦 ' + h(item.displayName) + '</div>',
    '<div class="sec-s" style="font-family:\'Courier New\',monospace;font-size:11px;color:var(--acc2)">' + ns + ':' + item.id + '</div>',

    '<div class="card"><div class="card-h">✏️ Properties</div>',
    '<div class="fg fg2">',
    '<div class="fld"><label>Item ID</label><input value="'+h(item.id)+'" readonly style="color:var(--text3)"></div>',
    '<div class="fld"><label>Display Name</label><input value="'+h(item.displayName)+'" oninput="updItem(\''+item.id+'\',\'displayName\',this.value)"></div>',
    '</div>',
    '<div class="fg fg2">',
    '<div class="fld"><label>Armor Slot</label><select onchange="updItem(\''+item.id+'\',\'slot\',this.value)">'+slotOpts+'</select></div>',
    '<div class="fld"><label>Icon Name</label><input value="'+h(item.iconName)+'" oninput="updItem(\''+item.id+'\',\'iconName\',this.value)"></div>',
    '</div></div>',

    '<div class="card"><div class="card-h">💻 เปิดแก้ไขใน Code Editor</div>',
    '<div class="al al-i" style="margin-bottom:12px;font-size:11px">⚡ = auto-generated &nbsp;·&nbsp; ✏️ = แก้ไขแล้ว — คลิกเพื่อเปิดในโปรแกรมแก้ไข</div>',
    '<div style="display:flex;flex-direction:column;gap:7px">',
    fileBtn(bpPath,  'items/' + item.id + '.json'),
    fileBtn(trPath,  'items/' + item.id + '_trigger.json'),
    fileBtn(attPath, 'attachables/' + item.id + '.json'),
    fileBtn(scriptPath, 'scripts/main.js'),
    '</div></div>',

    '<div class="card"><div class="card-h">🗑️ ลบไอเทม</div>',
    '<button class="btn btn-r" style="width:100%" onclick="delItem(\''+item.id+'\',null)">✕ ลบ ' + h(item.displayName) + '</button>',
    '</div>',
  ].join('');
}

function switchItab(btn, id) {
  const card = btn.closest('.card');
  card.querySelectorAll('.mt-t').forEach(t => t.classList.remove('sel'));
  card.querySelectorAll('[id^="ia-"]').forEach(t => t.style.display='none');
  btn.classList.add('sel');
  document.getElementById(id).style.display = 'block';
}

function renderTexEd(el) {
  const id = S.selTexItem || (S.items[0] && S.items[0].id);
  const item = S.items.find(i => i.id === id);
  if (!item) {

function onSetupChange() {

const UUID_LBLS = {bpH:'BP Header',bpD:'BP Data',bpS:'BP Script',rpH:'RP Header',rpM:'RP Module'};
function genAllUUIDs() {
  S.proj.uuids = {bpH:uid(),bpD:uid(),bpS:uid(),rpH:uid(),rpM:uid()};

}
function renderUUIDs() {

/* ────────── ITEMS HANDLERS ────────── */
let iCtr = 0;
function addItem() {
  iCtr++;
  const id = 'item' + iCtr;
  S.items.push({id, displayName:'MyItem '+iCtr, slot:'slot.armor.legs', iconName:id+'_icon'});
  S.scriptCustom = null;
  S.selItem = id;
  S.act = 'items';
  S.panelOpen = true;
  applyPanel();
  renderAll();
}
function pickItem(id) {
  S.selItem = id;
  if (S.act !== 'items') { S.act='items'; S.panelOpen=true; applyPanel(); }
  renderAll();
}
function delItem(id, e) {
  if (e) e.stopPropagation();
  if (!confirm('ลบไอเทม "' + id + '"?')) return;
  S.items = S.items.filter(i => i.id !== id);
  delete S.tex['icon_'+id]; delete S.tex['model_'+id];
  delete S.models[id]; delete S.anims[id];
  // Remove custom file overrides for this item
  const ns = S.proj.ns||'myaddon';
  const bp = 'BehaviorPack_'+ns, rp = 'ResourcePack_'+ns;
  delete S.customFiles[bp+'/items/'+id+'.json'];
  delete S.customFiles[bp+'/items/'+id+'_trigger.json'];
  delete S.customFiles[rp+'/attachables/'+id+'.json'];
  if (S.selItem === id) S.selItem = S.items.length ? S.items[0].id : null;
  if (S.selAssetItem === id) S.selAssetItem = S.items.length ? S.items[0].id : null;
  S.scriptCustom = null;
  renderAll();
}
function updItem(id, key, val) {
  const it = S.items.find(i => i.id === id); if (!it) return;
  it[key] = val; S.scriptCustom = null;
  renderPanel(); renderStatus();
}

function handleModel(e, itemId) {

function saveAnimText(itemId, txt) {
  if (txt.trim()) S.anims[itemId] = txt;
  else delete S.anims[itemId];
}
function delModel(itemId) { delete S.models[itemId]; renderAll(); }
function delAnim(itemId)  { delete S.anims[itemId];  renderAll(); }

function copyText(taId) {
  const ta = document.getElementById(taId); if (!ta) return;
  navigator.clipboard.writeText(ta.value).then(() => showSaveBadge('📋 Copied!'));
}
function downloadAssetFile(type, itemId) {
  const content = type === 'geo' ? S.models[itemId] : S.anims[itemId];
  if (!content) return;
  const fname = type === 'geo' ? itemId + '.geo.json' : itemId + '.animation.json';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], {type:'application/json'}));
  a.download = fname;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(a.href);
}

/* ────────── CODE EDITOR ────────── */
function getAllEditorFiles() {
  const ns = S.proj.ns||'myaddon';
  const files = getFiles();
  // Add texture files
  Object.keys(S.tex).forEach(k => {
    const isI = k.startsWith('icon_'), id = k.replace(/^(icon|model)_/,'');
    const rp = 'ResourcePack_'+ns;
    files[isI ? rp+'/textures/seaitem/'+id+'.png' : rp+'/textures/seana/'+id+'.png'] = S.tex[k];
  });
  return files;
}

function renderEditorPanel(b) {
  const files = getAllEditorFiles();
  b._files = files;
  b.innerHTML = buildEditorTree(files, b._treeQ || '');
}

function buildEditorTree(files, q) {
  const sorted = Object.keys(files).sort();
  const shown  = q ? sorted.filter(f => f.toLowerCase().includes(q.toLowerCase())) : sorted;
  const done   = new Set();
  let html = '<div style="padding:6px 8px 2px"><input placeholder="🔍 ค้นหา..." style="width:100%;background:#2a2a2a;border:1px solid var(--border);border-radius:4px;padding:4px 8px;color:var(--text);font-size:11px;font-family:inherit;outline:none" oninput="filterEditorTree(this.value)" value="'+h(q)+'"></div>';

  shown.forEach(path => {
    const parts = path.split('/');
    for (let i = 1; i < parts.length; i++) {
      const dir = parts.slice(0, i).join('/');
      if (!done.has(dir)) {
        html += '<div class="ti dir d'+Math.min(i-1,2)+'">📁 '+h(parts[i-1])+'</div>';
        done.add(dir);
      }
    }
    const depth = Math.min(parts.length-1, 2);
    const fname = parts[parts.length-1];
    const isCustom = !!S.customFiles[path];
    const isScript = path.endsWith('.js');
    const isImg = fname.endsWith('.png') || (files[path]||'').startsWith?.('data:image');
    const ico = isImg ? '🖼️' : isScript ? '⚡' : fname.endsWith('.json') ? '📋' : '📄';
    const sel = path === S.pvFile ? ' sel' : '';
    const badge = isCustom ? ' <span style="font-size:9px;color:var(--acc2);margin-left:3px">●</span>' : '';
    const pathEsc = path.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    html += '<div class="ti d'+depth+sel+'" onclick="openInEditor(\''+pathEsc+'\')">'+ico+' '+h(fname)+badge+'</div>';
  });
  return html;
}

function filterEditorTree(q) {
  const b = $('#pbody');
  if (!b || !b._files) return;
  b._treeQ = q;
  b.innerHTML = buildEditorTree(b._files, q);
  b._files = b._files;
}

function openInEditor(path) {
  S.pvFile = path;
  S.act = 'editor';
  S.panelOpen = true;
  applyPanel();
  renderAll();
}

function getEditorContent(path) {
  // Check custom override first
  if (S.customFiles[path] !== undefined) return S.customFiles[path];
  const files = getAllEditorFiles();
  return files[path] ?? null;
}

function renderCodeEditor(el) {
  const path = S.pvFile;
  const content = path ? getEditorContent(path) : null;
  const fname = path ? path.split('/').pop() : '';
  const isImg = fname.endsWith('.png') || (typeof content === 'string' && content.startsWith('data:image'));
  const isEditable = path && !isImg && content !== null;
  const isCustom = path && !!S.customFiles[path];
  const langKey = fname.endsWith('.js') ? 'js' : fname.endsWith('.json') ? 'json' : fname.endsWith('.txt') ? 'txt' : isImg ? 'img' : 'txt';
  const langLabel = {js:'JS',json:'JSON',txt:'TXT',img:'IMAGE'}[langKey] || 'TXT';

  el.innerHTML = [
    '<div class="ed-toolbar">',
    path ? [
      '<span class="ed-lang '+langKey+'">'+langLabel+'</span>',
      '<span class="ed-path">'+h(path)+'</span>',
      isCustom
        ? '<span style="font-size:10px;color:var(--acc2);flex-shrink:0">✏️ แก้ไขแล้ว</span>'
        : '<span style="font-size:10px;color:var(--text3);flex-shrink:0">⚡ auto-generated</span>',
      '<div style="flex:1"></div>',
      isCustom ? '<button class="bxs" onclick="resetEditorFile()" title="คืนค่า auto-generated">↩ Reset</button>' : '',
      isEditable ? '<button class="bxs" onclick="formatEditorJSON()" title="Format JSON">{ }</button>' : '',
      isEditable ? '<button class="bxs" onclick="copyEditorContent()">📋 Copy</button>' : '',
    ].join('') :
    '<span style="color:var(--text3);font-size:11px">← เลือกไฟล์จากแถบซ้าย</span>',
    '</div>',
    '<div class="ed-body">',
    !path ? '<div class="ed-welcome"><div style="font-size:48px">💻</div><div style="font-size:13px">Code Editor</div><div style="font-size:11px">เปิดไฟล์จากแถบซ้าย — แก้ได้ทุกไฟล์</div></div>' :
    isImg ? '<div class="ed-img-view"><img src="'+content+'" style="max-width:220px;image-rendering:pixelated;border:1px solid var(--border);border-radius:6px"><div style="font-size:11px;color:var(--text3)">'+h(fname)+'</div></div>' :
    content === null ? '<div class="ed-welcome"><div style="font-size:32px">📄</div><div style="font-size:11px;color:var(--text3)">ไฟล์นี้เป็น placeholder — จะสร้างเมื่อ download</div></div>' :
    '<textarea id="code-ta" class="code-editor-ta" spellcheck="false" oninput="onEditorInput(this,\''+path.replace(/'/g,"\\'")+'\')" onkeydown="handleEditorKey(event)">'+h(content)+'</textarea>',
    '</div>',
  ].join('');

  // Auto-focus textarea
  requestAnimationFrame(() => {
    const ta = document.getElementById('code-ta');
    if (ta) ta.focus();
  });
}

function onEditorInput(ta, path) {
  const content = ta.value;
  // Get generated content to compare
  const generated = getGeneratedContent(path);
  if (generated !== null && content === generated) {
    delete S.customFiles[path];
  } else {
    S.customFiles[path] = content;
  }
  // Update panel dot indicators
  renderActivityBar();
  renderEditorPanelIfOpen();
}

function getGeneratedContent(path) {
  // Returns what the file would contain if not overridden
  const ns = S.proj.ns||'myaddon';
  const bp = 'BehaviorPack_'+ns, rp = 'ResourcePack_'+ns;
  if (path === bp+'/manifest.json') return genBPManifest();
  if (path === rp+'/manifest.json') return genRPManifest();
  if (path === bp+'/scripts/main.js') return genScriptJS();
  if (path === rp+'/textures/item_texture.json') return genItemTextureJSON();
  for (const it of S.items) {
    if (path === bp+'/items/'+it.id+'.json') return genArmorJSON(it);
    if (path === bp+'/items/'+it.id+'_trigger.json') return genTriggerJSON(it);
    if (path === rp+'/attachables/'+it.id+'.json') return genAttachableJSON(it);
    if (path === rp+'/models/entity/'+it.id+'.geo.json') return S.models[it.id] || null;
    if (path === rp+'/animations/'+it.id+'.animation.json') return S.anims[it.id] || null;
  }
  return null;
}

function resetEditorFile() {
  if (!S.pvFile) return;
  delete S.customFiles[S.pvFile];
  renderAll();
  showSaveBadge('↩ คืนค่า auto-generated แล้ว');
}

function formatEditorJSON() {
  const ta = document.getElementById('code-ta');
  if (!ta) return;
  try {
    const parsed = JSON.parse(ta.value);
    const formatted = JSON.stringify(parsed, null, 2);
    ta.value = formatted;
    if (S.pvFile) onEditorInput(ta, S.pvFile);
    showSaveBadge('✅ Format แล้ว');
  } catch(e) {
    showSaveBadge('❌ JSON ไม่ถูกต้อง: ' + e.message);
  }
}

function copyEditorContent() {
  const ta = document.getElementById('code-ta');
  if (!ta) return;
  navigator.clipboard.writeText(ta.value).then(() => showSaveBadge('📋 Copied!'));
}

function handleEditorKey(e) {
  // Tab → insert 2 spaces
  if (e.key === 'Tab') {
    e.preventDefault();
    const ta = e.target;
    const start = ta.selectionStart, end = ta.selectionEnd;
    ta.value = ta.value.substring(0, start) + '  ' + ta.value.substring(end);
    ta.selectionStart = ta.selectionEnd = start + 2;
    onEditorInput(ta, S.pvFile);
  }
}

function renderEditorPanelIfOpen() {
  if (S.act === 'editor') {
    const b = $('#pbody');
    if (b && b._files) renderEditorPanel(b);
  }
}

/* ────────── FILE GENERATORS ────────── */
function genBPManifest() {
  const {bpName,desc,uuids} = S.proj;
  return j({format_version:2,
    header:{name:bpName,description:desc,uuid:uuids.bpH||'GENERATE-UUID',
      version:[1,0,0],min_engine_version:[1,20,0]},
    modules:[
      {type:'data',uuid:uuids.bpD||'GENERATE-UUID',version:[1,0,0]},
      {type:'script',uuid:uuids.bpS||'GENERATE-UUID',version:[0,0,1],
        entry:'scripts/main.js',language:'javascript'}],
    dependencies:[
      {uuid:uuids.rpH||'GENERATE-UUID',version:[1,0,0]},
      {module_name:'@minecraft/server',version:'1.14.0'}]});
}
function genRPManifest() {
  const {rpName,desc,uuids} = S.proj;
  return j({format_version:2,
    header:{name:rpName,description:desc,uuid:uuids.rpH||'GENERATE-UUID',
      version:[1,0,0],min_engine_version:[1,20,0]},
    modules:[{type:'resources',uuid:uuids.rpM||'GENERATE-UUID',version:[1,0,0]}]});
}
function genArmorJSON(item) {
  const ns = S.proj.ns||'myaddon';
  return j({format_version:'1.21.10','minecraft:item':{
    description:{identifier:ns+':'+item.id,menu_category:{category:'none'}},
    components:{'minecraft:icon':item.iconName,'minecraft:max_stack_size':1,
      'minecraft:display_name':{value:item.displayName},
      'minecraft:wearable':{slot:item.slot}}}});
}
function genTriggerJSON(item) {
  const ns = S.proj.ns||'myaddon';
  return j({format_version:'1.21.10','minecraft:item':{
    description:{identifier:ns+':'+item.id+'_trigger',menu_category:{category:'equipment'}},
    components:{'minecraft:max_stack_size':1,'minecraft:icon':item.iconName,
      'minecraft:display_name':{value:item.displayName+'\n§7(คลิ้กขวา)'}}}});
}
function genAttachableJSON(item) {
  const ns = S.proj.ns||'myaddon';
  const geo = 'geometry.'+ns+'_'+item.id;
  const anim = 'animation.'+ns+'_'+item.id;
  return j({format_version:'1.10.0','minecraft:attachable':{description:{
    identifier:ns+':'+item.id,
    item:{[ns+':'+item.id]:"query.owner_identifier == 'minecraft:player'"},
    materials:{default:'entity_emissive_alpha'},
    textures:{default:'textures/seana/'+item.id},
    geometry:{default:geo},
    scripts:{initialize:['variable.init=0;'],
      pre_animation:['variable.head_y=-query.target_y_rotation/6;'],
      animate:['main']},
    animations:{main:anim},
    render_controllers:['controller.render.item_default']}}}); 
}
function genItemTextureJSON() {
  const d = {};
  S.items.forEach(it => { d[it.iconName] = {textures:['textures/seaitem/'+it.id]}; });
  return j({resource_pack_name:'vanilla',texture_name:'atlas.items',texture_data:d});
}
function genScriptJS() {
  const ns = S.proj.ns||'myaddon';
  const ag = S.opts.autoGive;
  const pl = S.opts.playerFilter.trim();
  const players = pl ? pl.split(',').map(s=>s.trim()).filter(Boolean) : [];
  if (!S.items.length) return 'import { world, system } from "@minecraft/server";\n// เพิ่มไอเทมก่อน';
  const L = ['import { world, system } from "@minecraft/server";',''];
  S.items.forEach(it => {
    const T = it.id.toUpperCase();
    L.push('const TRIGGER_'+T+' = "'+ns+':'+it.id+'_trigger";');
    L.push('const ARMOR_'+T+'   = "'+ns+':'+it.id+'";');
    L.push('const SLOT_'+T+'    = "'+it.slot+'";');
  });
  L.push('');
  if (ag) {
    L.push('// ─── Auto-give เมื่อ spawn ───');
    L.push('world.afterEvents.playerSpawn.subscribe(async (ev) => {');
    L.push('  if (!ev.initialSpawn) return;');
    if (players.length) L.push('  if (!['+players.map(p=>'"'+p+'"').join(',')+'].includes(ev.player.name)) return;');
    L.push('  system.runTimeout(async () => {');
    L.push('    const p = ev.player;');
    S.items.forEach(it => {
      const T = it.id.toUpperCase();
      L.push('    try {');
      L.push('      const r = await p.runCommandAsync(`execute unless entity @s[hasitem={item=${TRIGGER_'+T+'}}] run give @s ${TRIGGER_'+T+'} 1`);');
      L.push('      if (r.successCount > 0) p.sendMessage("§aได้รับ §l'+it.displayName+'§r§a!");');
      L.push('    } catch {}');
    });
    L.push('  }, 20);','});','');
  }
  L.push('// ─── Toggle ใส่/ถอด ───');
  L.push('world.beforeEvents.itemUse.subscribe((ev) => {');
  L.push('  const { itemStack: item, source: p } = ev;');
  L.push('  if (!p?.isValid() || !item) return;','');
  S.items.forEach(it => {
    const T = it.id.toUpperCase();
    L.push('  if (item.typeId === TRIGGER_'+T+') {');
    L.push('    ev.cancel = true;');
    L.push('    system.run(async () => {');
    L.push('      try {');
    L.push('        const w = await p.runCommandAsync(`execute if entity @s[hasitem={item=${ARMOR_'+T+'},location=${SLOT_'+T+'}}] run clear @s ${ARMOR_'+T+'}`);');
    L.push('        if (w.successCount > 0) return;');
    L.push('        await p.runCommandAsync(`clear @s ${ARMOR_'+T+'}`);');
    L.push('        await p.runCommandAsync(`replaceitem entity @s ${SLOT_'+T+'} 0 ${ARMOR_'+T+'}`);');
    L.push('      } catch(e) { p.sendMessage("§cError: " + e.message); }');
    L.push('    });','    return;','  }','');
  });
  L.push('});');
  return L.join('\n');
}
function getFiles() {
  const ns = S.proj.ns||'myaddon';
  const bp = 'BehaviorPack_'+ns, rp = 'ResourcePack_'+ns;
  const f = {};

  // Manifests
  f[bp+'/manifest.json'] = genBPManifest();
  f[rp+'/manifest.json'] = genRPManifest();

  // Script — check customFiles first, then S.scriptCustom (legacy), then generate
  const scriptPath = bp+'/scripts/main.js';
  f[scriptPath] = S.customFiles[scriptPath] ?? (S.scriptCustom !== null ? S.scriptCustom : genScriptJS());

  // Pack icons
  if (S.proj.bpIcon) f[bp+'/pack_icon.png'] = S.proj.bpIcon;
  if (S.proj.rpIcon) f[rp+'/pack_icon.png'] = S.proj.rpIcon;

  // Items
  S.items.forEach(it => {
    const bpItemPath = bp+'/items/'+it.id+'.json';
    const trItemPath = bp+'/items/'+it.id+'_trigger.json';
    const attPath    = rp+'/attachables/'+it.id+'.json';
    // Use custom override if exists, else generate
    f[bpItemPath] = S.customFiles[bpItemPath] ?? genArmorJSON(it);
    f[trItemPath] = S.customFiles[trItemPath] ?? genTriggerJSON(it);
    f[attPath]    = S.customFiles[attPath]    ?? genAttachableJSON(it);

    // Models (geo.json)
    if (S.models[it.id]) {
      f[rp+'/models/entity/'+it.id+'.geo.json'] = S.models[it.id];
    } else {
      f[rp+'/models/entity/'+it.id+'.geo.json'] = null; // placeholder
    }

    // Animations
    if (S.anims[it.id]) {
      f[rp+'/animations/'+it.id+'.animation.json'] = S.anims[it.id];
    }

    // Texture placeholders
    if (!S.tex['icon_'+it.id])  f[rp+'/textures/seaitem/'+it.id+'.png'] = null;
    if (!S.tex['model_'+it.id]) f[rp+'/textures/seana/'+it.id+'.png']   = null;
  });

  if (S.items.length) {
    f[rp+'/textures/item_texture.json'] = genItemTextureJSON();
  }

  // Any extra custom files not covered above
  Object.entries(S.customFiles || {}).forEach(([path, content]) => {
    if (!(path in f)) f[path] = content;
  });

  f['README.txt'] = [
    'MC ADDON — '+S.proj.bpName,
    'Namespace: '+ns,
    'Items: '+S.items.map(i=>ns+':'+i.id).join(', '),
    '',
    'ไฟล์ที่รวมมาด้วย:',
    S.proj.bpIcon  ? '✅ BP pack_icon.png' : '⚠️ ยังไม่มี BP icon',
    S.proj.rpIcon  ? '✅ RP pack_icon.png' : '⚠️ ยังไม่มี RP icon',
    S.items.some(i=>S.models[i.id])  ? '✅ Geometry (.geo.json)' : '⚠️ ยังไม่มี geometry',
    S.items.some(i=>S.anims[i.id])   ? '✅ Animation (.animation.json)' : '⚠️ ยังไม่มี animation',
  ].join('\n');
  return f;
}

/* ────────── DOWNLOAD ────────── */
async function downloadAddon() {
  if (!Object.values(S.proj.uuids).every(v=>v)) {
    alert('Generate UUID ก่อน!\nไปที่ ⚙️ ตั้งค่า → ✨ Generate ทั้งหมด'); return;
  }
  if (!S.items.length) { alert('เพิ่มไอเทมอย่างน้อย 1 ตัวก่อน'); return; }
  if (typeof JSZip === 'undefined') { alert('JSZip ยังโหลดไม่เสร็จ ลองใหม่'); return; }
  const btns = $$('.dl-btn, .tb-pri, #hdr-dl');
  btns.forEach(b => b.disabled=true);
  try {
    const zip  = new JSZip();
    const ns   = S.proj.ns||'myaddon';
    const bp   = 'BehaviorPack_'+ns, rp = 'ResourcePack_'+ns;
    const files = getFiles();

    // Add all generated/custom text files
    for (const [p, c] of Object.entries(files)) {
      if (!c) continue;
      if (typeof c === 'string' && c.startsWith('data:image')) {
        zip.file(p, c.split(',')[1], {base64:true});
      } else if (typeof c === 'string') {
        zip.file(p, c);
      }
    }

    // Textures (icon + model per item)
    for (const [k, durl] of Object.entries(S.tex)) {
      if (!durl) continue;
      const isI = k.startsWith('icon_'), id = k.replace(/^(icon|model)_/,'');
      zip.file(isI ? rp+'/textures/seaitem/'+id+'.png' : rp+'/textures/seana/'+id+'.png',
        durl.split(',')[1], {base64:true});
    }

    const blob = await zip.generateAsync({type:'blob', compression:'DEFLATE'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = ns+'_addon.mcaddon';
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(a.href);
    btns.forEach(b => b.disabled=false);
  } catch(e) {
    alert('Error: ' + e.message);
    btns.forEach(b => b.disabled=false);
  }
}

      {name:'rightArm',parent:'root',pivot:[-5,22,0],cubes:[{origin:[-8,12,-2],size:[4,12,4],uv:[40,16]}]},
      {name:'leftArm', parent:'root',pivot:[5,22,0], cubes:[{origin:[4,12,-2], size:[4,12,4],uv:[40,16]}]}

    '<div class="tpl-card-ico">' + t.ico + '</div>',
    '<div class="tpl-card-name">' + t.name + '</div>',
    '<div class="tpl-card-desc">' + t.desc.replace(/\n/g,'<br>') + '</div>',
    '<div class="tpl-card-slot">' + t.slot + '</div>',
    (item && item.slot === t.slot ? '<div style="font-size:9px;color:var(--acc);margin-top:4px">✅ ตรงกับ slot ปัจจุบัน</div>' : ''),
    '</div>'
  ].join('')).join('') + '</div>' +
  '<div class="al al-i" style="margin-top:14px">💡 Template จาก Blockbench เลือก slot ให้ตรงกับไอเทม แล้วส่งออก .geo.json มาแทนได้ทุกเมื่อ</div>';
}

function _renderAnimTpls(item) {

    '<div class="tpl-card" onclick="applyAnimTemplate(\''+t.key+'\')">',

function applyGeoTemplate(templateKey, slot) {
  if (!_tplTargetId) { closeTplModal(); return; }
  const ns   = S.proj.ns || 'myaddon';
  const item = S.items.find(i => i.id === _tplTargetId);
  if (!item) { closeTplModal(); return; }
  S.models[_tplTargetId] = makeGeo(ns, _tplTargetId, slot);
  // Also update item slot to match
  item.slot = slot;
  closeTplModal();
  S.selAssetItem = _tplTargetId;
  S.act = 'assets'; S.panelOpen = true; applyPanel();
  renderAll();
  showSaveBadge('✅ ใช้ Template: '+templateKey);
}

function applyAnimTemplate(templateKey) {
  if (!_tplTargetId) { closeTplModal(); return; }
  const ns = S.proj.ns || 'myaddon';
  S.anims[_tplTargetId] = makeAnim(ns, _tplTargetId, templateKey);
  closeTplModal();
  S.selAssetItem = _tplTargetId;
  S.act = 'assets'; S.panelOpen = true; applyPanel();
  renderAll();
  showSaveBadge('✅ ใช้ Template: '+templateKey);
}


let projectDirHandle = null;
const FS_SUPPORTED = ('showDirectoryPicker' in window);

async function saveProjectToDir() {
  if (!projectDirHandle) { _lsSave(); return; }
  try {
    // Save state without binary data (stored separately)
    const saveData = JSON.stringify({...S, tex:{}, proj:{...S.proj, bpIcon:null, rpIcon:null}}, null, 2);
    const fh = await projectDirHandle.getFileHandle('project.json', {create:true});
    const w = await fh.createWritable();
    await w.write(saveData); await w.close();

    // Helper: save dataURL as file
    async function saveDataUrl(filename, dataUrl) {
      if (!dataUrl || !dataUrl.startsWith('data:')) return;
      const base64 = dataUrl.split(',')[1];
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      const mimeMatch = dataUrl.match(/^data:([^;]+)/);
      const mime = mimeMatch ? mimeMatch[1] : 'application/octet-stream';
      const blob = new Blob([bytes], {type: mime});
      const tfh = await projectDirHandle.getFileHandle(filename, {create:true});
      const tw = await tfh.createWritable();
      await tw.write(blob); await tw.close();
    }

    // Save item textures
    for (const [key, dataUrl] of Object.entries(S.tex)) {
      await saveDataUrl('tex_'+key+'.png', dataUrl);
    }
    // Save pack icons
    if (S.proj.bpIcon) await saveDataUrl('icon_bp.png', S.proj.bpIcon);
    if (S.proj.rpIcon) await saveDataUrl('icon_rp.png', S.proj.rpIcon);

    // Save models and animations as text files
    for (const [id, text] of Object.entries(S.models)) {
      const mfh = await projectDirHandle.getFileHandle('model_'+id+'.geo.json', {create:true});
      const mw = await mfh.createWritable();
      await mw.write(text); await mw.close();
    }
    for (const [id, text] of Object.entries(S.anims)) {
      const afh = await projectDirHandle.getFileHandle('anim_'+id+'.animation.json', {create:true});
      const aw = await afh.createWritable();
      await aw.write(text); await aw.close();
    }

    _saveRecentMeta();
    showSaveBadge('💾 บันทึกลงโฟลเดอร์แล้ว');
  } catch(e) {
    console.error('Dir save error:', e);
    _lsSave();
  }
}

async function loadProjectFromDir(dir) {
  projectDirHandle = dir;
  try {
    const fh = await dir.getFileHandle('project.json');
    const file = await fh.getFile();
    S = Object.assign(makeState(), JSON.parse(await file.text()));
    S.tex = {}; S.models = {}; S.anims = {};
    if (!S.proj.bpIcon) S.proj.bpIcon = null;
    if (!S.proj.rpIcon) S.proj.rpIcon = null;

    // Helper: read file as dataURL
    async function readAsDataUrl(handle) {
      const f = await handle.getFile();
      return new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = e => res(e.target.result);
        r.onerror = rej;
        r.readAsDataURL(f);
      });
    }
    // Helper: read file as text
    async function readAsText(handle) {
      const f = await handle.getFile();
      return f.text();
    }

    for await (const [name, handle] of dir.entries()) {
      if (name.startsWith('tex_') && name.endsWith('.png')) {
        const key = name.replace(/^tex_/,'').replace(/\.png$/,'');
        S.tex[key] = await readAsDataUrl(handle);
      } else if (name === 'icon_bp.png') {
        S.proj.bpIcon = await readAsDataUrl(handle);
      } else if (name === 'icon_rp.png') {
        S.proj.rpIcon = await readAsDataUrl(handle);
      } else if (name.startsWith('model_') && name.endsWith('.geo.json')) {
        const id = name.replace(/^model_/,'').replace(/\.geo\.json$/,'');
        S.models[id] = await readAsText(handle);
      } else if (name.startsWith('anim_') && name.endsWith('.animation.json')) {
        const id = name.replace(/^anim_/,'').replace(/\.animation\.json$/,'');
        S.anims[id] = await readAsText(handle);
      }
    }
    return true;
  } catch(e) {
    console.error('Load from dir error:', e);
    return false;
  }
}

function _lsSave() {
  try { localStorage.setItem('mc_addon_builder_project', JSON.stringify(S)); } catch(e){}
}
function _lsLoad() {
  try {
    const d = localStorage.getItem('mc_addon_builder_project');
    if (d) S = Object.assign(makeState(), JSON.parse(d));
  } catch(e){}
}
function _saveRecentMeta() {
  if (!projectDirHandle) return;
  const key = 'mcab_recent_v2';
  const list = JSON.parse(localStorage.getItem(key)||'[]');
  const meta = {name: projectDirHandle.name, date: Date.now()};
  const idx = list.findIndex(r => r.name === meta.name);
  if (idx >= 0) list.splice(idx, 1);
  list.unshift(meta);
  localStorage.setItem(key, JSON.stringify(list.slice(0, 8)));
}

/* ─── SAVE BADGE ─── */
function showSaveBadge(msg) {
  let badge = document.getElementById('saveBadge');
  if (!badge) {
    badge = document.createElement('div');
    badge.id = 'saveBadge';
    badge.style.cssText = 'position:fixed;bottom:30px;right:16px;background:#3d8b5e;color:#fff;font-size:11px;font-weight:600;padding:5px 12px;border-radius:5px;z-index:9999;opacity:0;transition:opacity .3s';
    document.body.appendChild(badge);
  }
  badge.textContent = msg;
  badge.style.opacity = '1';
  clearTimeout(badge._t);
  badge._t = setTimeout(() => badge.style.opacity='0', 2000);
}

/* ─── AUTO SAVE ─── */
setInterval(async () => { await saveProjectToDir(); }, 3000);

/* ─── DOWNLOAD WITH PROGRESS ─── */
const _oldDownloadAddon = downloadAddon;
downloadAddon = async function() {
  const ov = document.getElementById('exportOverlay');
  const bar = document.getElementById('exportBar');
  const txt = document.getElementById('exportText');
  try {
    ov.style.display='flex'; bar.style.width='15%'; txt.textContent='Preparing files...';
    await new Promise(r=>setTimeout(r,100));
    bar.style.width='60%'; txt.textContent='Building addon...';
    await _oldDownloadAddon();
    bar.style.width='100%'; txt.textContent='Export complete!';
    setTimeout(()=>{ ov.style.display='none'; }, 800);
  } catch(e) {
    txt.textContent='Export failed';
    setTimeout(()=>{ ov.style.display='none'; }, 1200);
    throw e;
  }
};

/* ─── PROJECT HUB ─── */
function renderProjectList() {
  const wrap = document.getElementById('projectList');
  if (!wrap) return;
  const list = JSON.parse(localStorage.getItem('mcab_recent_v2')||'[]');
  if (!list.length) {
    wrap.innerHTML = '<div style="color:#666;font-size:12px;text-align:center;padding:16px 0">ยังไม่มีโปรเจกต์ล่าสุด</div>';
    return;
  }
  wrap.innerHTML = list.map((p,i) => {
    const d = new Date(p.date);
    const ds = d.toLocaleDateString('th-TH')+' '+d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
    return `<div class="projectCard" onclick="reOpenProject(${i})">
      <div style="display:flex;align-items:center;gap:10px">
        <span style="font-size:22px">📁</span>
        <div style="flex:1;min-width:0">
          <div style="font-weight:700;color:#eee;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${h(p.name)}</div>
          <div style="font-size:11px;color:#666;margin-top:2px">${ds}</div>
        </div>
        <span style="font-size:11px;color:#4ade80">เปิด →</span>
      </div>
    </div>`;
  }).join('');
}

async function reOpenProject(idx) {
  const list = JSON.parse(localStorage.getItem('mcab_recent_v2')||'[]');
  const meta = list[idx];
  if (!meta) return;
  if (!FS_SUPPORTED) {
    _lsLoad(); closeHub(); return;
  }
  try {
    const dir = await window.showDirectoryPicker({mode:'readwrite', id:'mcab-project'});
    const ok = await loadProjectFromDir(dir);
    if (ok) {
      closeHub();
    } else {
      alert('ไม่พบไฟล์ project.json ในโฟลเดอร์นี้');
    }
  } catch(e) {
    if (e.name !== 'AbortError') alert('เกิดข้อผิดพลาด: '+e.message);
  }
}

async function createProjectNew() {
  const name = prompt('ชื่อโปรเจกต์ใหม่:');
  if (!name || !name.trim()) return;
  const ns = name.trim().toLowerCase().replace(/[^a-z0-9]/g,'_');

  if (FS_SUPPORTED) {
    try {
      // Ask browser for folder permission
      const dir = await window.showDirectoryPicker({mode:'readwrite', id:'mcab-project',
        startIn:'documents'});
      projectDirHandle = dir;
      // Initialize fresh state
      S = makeState();
      S.proj.bpName = name.trim() + ' BP';
      S.proj.rpName = name.trim() + ' RP';
      S.proj.ns = ns;
      S.proj.desc = 'Custom Addon by ' + name.trim();
      genAllUUIDs();
      await saveProjectToDir();
      closeHub();
    } catch(e) {
      if (e.name !== 'AbortError') alert('เกิดข้อผิดพลาด: '+e.message);
    }
  } else {
    // Fallback: localStorage only
    S = makeState();
    S.proj.bpName = name.trim() + ' BP';
    S.proj.rpName = name.trim() + ' RP';
    S.proj.ns = ns;
    genAllUUIDs();
    _lsSave();
    closeHub();
  }
}

async function openProjectFromFolder() {
  if (!FS_SUPPORTED) {
    _lsLoad(); closeHub(); return;
  }
  try {
    const dir = await window.showDirectoryPicker({mode:'readwrite', id:'mcab-project'});
    const ok = await loadProjectFromDir(dir);
    if (ok) {
      closeHub();
    } else {
      // Folder has no project.json — offer to initialize a new project here
      const name = prompt('ไม่พบโปรเจกต์ในโฟลเดอร์นี้\nใส่ชื่อโปรเจกต์เพื่อสร้างใหม่ที่นี่:');
      if (!name) return;
      projectDirHandle = dir;
      S = makeState();
      S.proj.bpName = name.trim() + ' BP';
      S.proj.rpName = name.trim() + ' RP';
      S.proj.ns = name.trim().toLowerCase().replace(/[^a-z0-9]/g,'_');
      genAllUUIDs();
      await saveProjectToDir();
      closeHub();
    }
  } catch(e) {
    if (e.name !== 'AbortError') alert('เกิดข้อผิดพลาด: '+e.message);
  }
}

function closeHub() {
  document.getElementById('projectHub').style.display = 'none';
  renderAll();
  applyPanel();
  $('#hdr-ns').textContent = S.proj.ns || 'myaddon';
}

function showHub() {
  document.getElementById('projectHub').style.display = 'flex';
  renderProjectList();
}

/* ─── INITIAL LOAD ─── */
_lsLoad();

/* ────────── INIT ────────── */
// Only generate UUIDs if they are empty (new state)
if (!Object.values(S.proj.uuids).some(v=>v)) {
  genAllUUIDs();
} else {
  renderActivityBar(); renderPanel(); renderStatus();
}
S.panelOpen = true;
renderAll();
applyPanel();
$('#hdr-ns').textContent = S.proj.ns || 'myaddon';
</script>
